name = "personal-ai-study-os-worker"
main = "src/index.ts"
compatibility_date = "2024-04-19"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "personal_study_os_db"
database_id = "00000000-0000-0000-0000-000000000000" # Local dev doesn't care
migrations_dir = "migrations"

[[queues.producers]]
binding = "SYNC_QUEUE"
queue = "personal-sync-queue"

[[queues.consumers]]
queue = "personal-sync-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "personal-sync-dlq"

[vars]
ENVIRONMENT = "development"
