name: Personal AI Study OS CI/CD Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  # ==========================================================================
  # Stage 1: Automated PR Gates
  # ==========================================================================
  pr-gate:
    name: 1. PR Verification Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-ai-study-os
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: personal-ai-study-os/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Build
        run: npm run build

  # ==========================================================================
  # Stage 2: Staging Deployment & Synthetic Verification (On Merge to main)
  # ==========================================================================
  staging-deployment:
    name: 2. Staging Deployment & Synthetic Gate
    needs: [pr-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: personal-ai-study-os/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: personal-ai-study-os

      - name: Apply Staging D1 Migrations
        run: npx wrangler d1 migrations apply DB --env staging --remote
        working-directory: personal-ai-study-os/apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Staging Worker
        run: npx wrangler deploy --env staging
        working-directory: personal-ai-study-os/apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Staging Synthetic Verification
        run: curl -f -s https://personal-ai-study-os-staging.riyasaksena502.workers.dev/health || exit 1

  # ==========================================================================
  # Stage 3: Production Promotion Gate (Triggered ONLY by Release Tag)
  # ==========================================================================
  production-promotion:
    name: 3. Explicit Production Promotion Gate
    needs: [pr-gate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: personal-ai-study-os/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: personal-ai-study-os

      - name: Apply Production D1 Migrations
        run: npx wrangler d1 migrations apply DB --env production --remote
        working-directory: personal-ai-study-os/apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Production Worker
        run: npx wrangler deploy --env production
        working-directory: personal-ai-study-os/apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Production Smoke Verification
        run: echo "Production deployment complete."
